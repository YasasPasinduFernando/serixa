name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  framework:
    name: Framework — PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    defaults:
      run:
        working-directory: framework

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install framework dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  framework-static:
    name: Framework — PHPStan + CS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install framework dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: composer phpstan

      - name: PHP-CS-Fixer (dry-run)
        run: composer cs-check

  packages-skeleton:
    name: Packages — skeleton check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Verify package skeletons
        run: php tools/scripts/test-packages.php

  starters-skeleton:
    name: Starters — skeleton check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Verify starter skeletons
        run: php tools/scripts/test-starters.php

  monorepo-meta:
    name: Monorepo — root composer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Root composer install (delegates to framework)
        run: composer install --no-interaction --prefer-dist
      - name: Root QA
        run: composer qa
