name: serixa-pdf
on:
  push: { paths: ['packages/pdf/**', 'framework/**'] }
  pull_request: { paths: ['packages/pdf/**', 'framework/**'] }
jobs:
  package:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/pdf } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none, tools: 'composer:v2' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer qa
