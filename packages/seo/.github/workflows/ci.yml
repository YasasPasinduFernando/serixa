name: serixa-seo
on:
  push:
    paths: ['packages/seo/**', 'framework/**']
  pull_request:
    paths: ['packages/seo/**', 'framework/**']
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/seo
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none, tools: 'composer:v2' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer qa
