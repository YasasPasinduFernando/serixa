name: serixa-firebase
on:
  push: { paths: ['packages/firebase/**', 'framework/**'] }
  pull_request: { paths: ['packages/firebase/**', 'framework/**'] }
jobs:
  package:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/firebase } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none, tools: 'composer:v2' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer qa
